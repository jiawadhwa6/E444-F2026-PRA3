{% extends "base.html" %}

{% block title %}Home Page{% endblock %}

{% block content %}
<h1>Hello, {{ name }}!</h1>
<p id="timestamp"></p>
<p id="relative-time"></p>
{% endblock %}

{% block scripts %}
<script>
    const now = moment();
    document.getElementById('timestamp').textContent = 
        'The local date and time is ' + now.format('LLLL') + '.';
    document.getElementById('relative-time').textContent = 
        'That was ' + now.fromNow() + '.';
</script>
{% endblock %}
